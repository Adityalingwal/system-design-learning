<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P0 Notes &amp; Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;1,14..32,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F3F6;--surface:#FFFFFF;--ink:#1B1F2A;--muted:#667085;--line:#D8DBE3;
  --chip-bg:#E9EBF0;--chip-ink:#3C4353;--accent:#2F6FEB;--bad:#E5484D;--bad-bg:#FDECEC;--good:#1E9E6A;
  --quote-bg:#F6F7FA;--code-bg:#E9EBF0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171C;--surface:#1E2128;--ink:#E8EAF0;--muted:#9AA0AE;--line:#2E323B;
    --chip-bg:#2A2E37;--chip-ink:#C7CBD5;--bad-bg:#2C1B1D;--quote-bg:#252932;--code-bg:#2A2E37;
  }
}
:root[data-theme="dark"]{
  --bg:#15171C;--surface:#1E2128;--ink:#E8EAF0;--muted:#9AA0AE;--line:#2E323B;
  --chip-bg:#2A2E37;--chip-ink:#C7CBD5;--bad-bg:#2C1B1D;--quote-bg:#252932;--code-bg:#2A2E37;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.62;padding:16px 16px 48px;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";overflow-wrap:anywhere}
.wrap{max-width:820px;margin:0 auto}
h1,h2,.mdh3,.qa h3.q{font-family:"Fraunces",Georgia,serif;font-optical-sizing:auto}
.eyebrow,.tag{font-family:"Inter",system-ui,sans-serif}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em;line-height:1.2}
.sub{color:var(--muted);font-size:14px;margin:0 0 6px}
.rel{font-size:13px;color:var(--muted);margin:0 0 12px}
a{color:var(--accent)}
code{font-family:"JetBrains Mono",Menlo,monospace;font-size:.9em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
button{font:inherit;color:inherit}
.tabs{display:flex;gap:6px;margin:8px 0 14px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;font-weight:600;cursor:pointer;color:var(--muted);margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* shared chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip,.toc a{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--chip-ink);background:var(--chip-bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.chip i,.toc a i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));display:inline-block}
.chip.on{background:var(--surface);border-color:var(--ink);color:var(--ink)}

/* notes */
.toc{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line)}
.sec{margin:22px 0 0;scroll-margin-top:56px}
.sec h2{font-size:20px;margin:0 0 10px;padding-top:10px;border-top:4px solid var(--c);display:flex;align-items:center;gap:10px}
.num{background:var(--c);color:#fff;border-radius:6px;min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.qa{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:12px 14px;margin:0 0 10px}
.qa h3.q,.card .q{font-size:15.5px;font-weight:600;margin:0 0 6px;line-height:1.4}
.a p{margin:6px 0}
.a p.core{font-size:15px}
.a p.arrow{color:var(--muted);font-size:14px}
.a ol{margin:6px 0;padding-left:22px}
.a li{margin:2px 0}
.line{margin:6px 0;font-size:14px;color:var(--chip-ink)}
.line em:first-child{font-style:normal;font-weight:600;font-family:"Inter",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:11.5px;color:var(--muted)}
.line.english{background:var(--quote-bg);border-left:3px solid var(--c);padding:6px 10px;border-radius:0 6px 6px 0;font-style:italic}
.line.english em:first-child{font-style:normal}
.line.example{padding-left:10px;border-left:3px solid var(--line)}
.line.hook{background:var(--chip-bg);padding:6px 10px;border-radius:6px}
.line.note,.line.watch,.line.trick{border-left:3px solid #E0B000;padding:2px 10px}
.line.rule{border-left:3px solid var(--good);padding:2px 10px;font-weight:600}
.tw{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--chip-bg);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
.foot{color:var(--muted);font-size:13px}


/* md notes */
.intro{margin-bottom:6px}
.intro .mdh1{font-size:20px;margin:6px 0 8px}
.mdh3{font-size:18px;margin:22px 0 8px;padding-left:10px;border-left:4px solid var(--c)}
#tab-notes p{margin:8px 0}
#tab-notes ul,#tab-notes ol{margin:8px 0;padding-left:22px}
#tab-notes li{margin:4px 0}
#tab-notes hr{border:0;border-top:1px solid var(--line);margin:18px 0}
pre.diagram{font-family:"JetBrains Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.45;white-space:pre;overflow-x:auto;max-width:100%;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:6px;padding:10px 12px;margin:10px 0;tab-size:4}
blockquote{margin:10px 0;padding:6px 12px;background:var(--quote-bg);border-left:3px solid var(--c,var(--accent));border-radius:0 6px 6px 0}
blockquote p{margin:4px 0!important;font-style:italic}

/* practice */
.use{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:0 0 10px;font-size:14px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.on{border-color:var(--bad);color:var(--bad)}
.count{font-family:"JetBrains Mono",Menlo,monospace;font-size:12.5px;color:var(--muted);margin-left:auto}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-left:5px solid var(--line);border-radius:8px;padding:10px 14px 12px;margin:0 0 10px;cursor:pointer}
.card:hover{border-color:var(--ink);border-top-color:var(--c)}
.card.yes{border-left-color:var(--good)}
.card.no{border-left-color:var(--bad);background:var(--bad-bg)}
.tag{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--c);margin-bottom:2px}
.card .a{transition:filter .15s}
.card:not(.revealed) .a{filter:blur(6px);user-select:none;pointer-events:none}
.card .marks{display:none;gap:8px;margin-top:10px}
.card.revealed .marks{display:flex}
.mk{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
.mk.y:hover,.mk.y.sel{border-color:var(--good);color:var(--good)}
.mk.n:hover,.mk.n.sel{border-color:var(--bad);color:var(--bad)}
.empty{color:var(--muted);padding:16px 0}

@media print{
  body{background:#fff;color:#000;padding:0;font-size:12px}
  .tabs,.toc,#tab-practice,.use{display:none!important}
  #tab-notes{display:block!important}
  .qa,pre.diagram,blockquote{break-inside:avoid}
  pre.diagram{white-space:pre-wrap}
  .card:not(.revealed) .a{filter:none}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">System design · P0</div>
  <h1>P0 Notes &amp; Practice</h1>
  <p class="sub">Notes = read · Practice = say the answer out loud first, then tap to check.</p>
</header>
<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="t-notes" data-tab="notes" aria-selected="true">Notes</button>
  <button class="tab" role="tab" id="t-practice" data-tab="practice" aria-selected="false">Practice</button>
</div>

<main id="tab-notes" role="tabpanel">
  <nav class="toc" aria-label="Sections">%%TOC%%</nav>
  %%NOTES%%
</main>

<main id="tab-practice" role="tabpanel" hidden>
  <div class="use"><b>Say the answer out loud in English first, then tap the card to check. Go over the missed ones again at the end.</b></div>
  <div class="chips" id="chips">%%CHIPS%%</div>
  <div class="bar">
    <button class="btn" id="toggleAll">Show all</button>
    <button class="btn" id="shuffle">Shuffle</button>
    <button class="btn" id="onlyNo">Only missed</button>
    <button class="btn" id="reset">Reset marks</button>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <div id="cards">%%PRAC%%</div>
  <p class="empty" id="empty" hidden>No cards match this filter.</p>
</main>
</div>
<script>
(function(){
  var TOTAL=%%TOTAL%%;
  var marks={}, SKEY='p0practice.marks', TKEY='p0practice.tab';
  function sget(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function sset(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  function sdel(k){try{localStorage.removeItem(k);}catch(e){}}
  try{var raw=sget(SKEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object')marks=o;}}catch(e){marks={};}
  var cardsEl=document.getElementById('cards');
  var cards=[].slice.call(cardsEl.querySelectorAll('.card'));
  var filter='all', onlyNo=false, allShown=false;

  function saveMarks(){sset(SKEY,JSON.stringify(marks));}
  function paintCard(c){
    var m=marks[c.id];
    c.classList.toggle('yes',m==='y');c.classList.toggle('no',m==='n');
    c.querySelector('.mk.y').classList.toggle('sel',m==='y');
    c.querySelector('.mk.n').classList.toggle('sel',m==='n');
  }
  function counts(){
    var y=0,n=0;cards.forEach(function(c){if(marks[c.id]==='y')y++;else if(marks[c.id]==='n')n++;});
    document.getElementById('count').textContent='Got: '+y+' · Missed: '+n+' · Left: '+(TOTAL-y-n);
  }
  function applyFilter(){
    var shown=0;
    cards.forEach(function(c){
      var ok=(filter==='all'||c.dataset.sec===filter)&&(!onlyNo||marks[c.id]==='n');
      c.hidden=!ok; if(ok)shown++;
    });
    document.getElementById('empty').hidden=shown>0;
  }
  function setReveal(c,on){c.classList.toggle('revealed',on);c.setAttribute('aria-expanded',on?'true':'false');}
  function refreshToggleLabel(){document.getElementById('toggleAll').textContent=allShown?'Hide all':'Show all';}

  cards.forEach(function(c){
    paintCard(c);
    c.addEventListener('click',function(e){
      if(e.target.closest('.mk'))return;
      setReveal(c,!c.classList.contains('revealed'));
    });
    c.addEventListener('keydown',function(e){
      if(e.target!==c)return;
      if(e.key==='Enter'||e.key===' '){e.preventDefault();setReveal(c,!c.classList.contains('revealed'));}
    });
    [].forEach.call(c.querySelectorAll('.mk'),function(b){
      b.addEventListener('click',function(e){
        e.stopPropagation();
        var m=b.dataset.m;
        if(marks[c.id]===m)delete marks[c.id];else marks[c.id]=m;
        saveMarks();paintCard(c);counts();applyFilter();
      });
    });
  });

  document.getElementById('chips').addEventListener('click',function(e){
    var b=e.target.closest('.chip');if(!b)return;
    filter=b.dataset.f;
    [].forEach.call(document.querySelectorAll('#chips .chip'),function(x){x.classList.toggle('on',x===b);});
    cards.sort(function(a,b2){return a.dataset.i-b2.dataset.i;}).forEach(function(c){cardsEl.appendChild(c);});
    applyFilter();
  });
  document.getElementById('toggleAll').addEventListener('click',function(){
    allShown=!allShown;
    cards.forEach(function(c){if(!c.hidden)setReveal(c,allShown);});
    refreshToggleLabel();
  });
  document.getElementById('shuffle').addEventListener('click',function(){
    var vis=cards.filter(function(c){return !c.hidden;});
    var slots=vis.map(function(c){return cards.indexOf(c);});
    for(var i=vis.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=vis[i];vis[i]=vis[j];vis[j]=t;}
    slots.forEach(function(s,k){cards[s]=vis[k];});
    cards.forEach(function(c){cardsEl.appendChild(c);});
  });
  document.getElementById('onlyNo').addEventListener('click',function(){
    onlyNo=!onlyNo;this.classList.toggle('on',onlyNo);applyFilter();
  });
  document.getElementById('reset').addEventListener('click',function(){
    marks={};sdel(SKEY);cards.forEach(paintCard);counts();applyFilter();
  });

  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  function showTab(name){
    tabs.forEach(function(t){t.setAttribute('aria-selected',t.dataset.tab===name?'true':'false');});
    document.getElementById('tab-notes').hidden=name!=='notes';
    document.getElementById('tab-practice').hidden=name!=='practice';
  }
  tabs.forEach(function(t){t.addEventListener('click',function(){showTab(t.dataset.tab);sset(TKEY,t.dataset.tab);window.scrollTo(0,0);});});
  var lt=sget(TKEY);showTab(lt==='practice'?'practice':'notes');

  counts();applyFilter();refreshToggleLabel();
})();
</script>
</body>
</html>
